name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Ruff, mypy, pytest (${{ matrix.phcc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.13.363 = Home Assistant 2026.9.0 (minimum), 0.13.372 = 2026.10.1
        phcc: ["0.13.363", "0.13.372"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libturbojpeg0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        # Type-check against the newest Home Assistant only.
        if: matrix.phcc == '0.13.372'
        run: mypy
      - name: pytest
        run: pytest -q
