send_text:
  fields:
    who:
      required: true
      example: simon
      selector:
        text:
    message:
      required: true
      example: "洗衣機已完成"
      selector:
        text:
          multiline: true

send_image:
  fields:
    who:
      required: true
      example: simon
      selector:
        text:
    image_path:
      required: true
      example: "/media/snapshot.jpg"
      selector:
        text:

send_screen_shot:
  fields:
    who:
      required: true
      example: simon
      selector:
        text:
    camera_entity:
      required: true
      example: camera.front_door
      selector:
        entity:
          filter:
            - domain: camera
